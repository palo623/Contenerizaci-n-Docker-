<!DOCTYPE html>
<html>
<head>
    <title>Chat IA</title>
</head>
<body>

<h1>Chat IA</h1>

<input id="prompt">
<button onclick="send()">Enviar</button>

<pre id="response"></pre>

<script>
async function send() {

    const prompt =
        document.getElementById("prompt").value;

    const result =
        await fetch(
            "http://localhost:25000/chat?prompt=" + prompt,
            { method: "POST" }
        );

    const data = await result.json();

    document.getElementById("response")
        .innerText = JSON.stringify(data, null, 2);
}
</script>

</body>
</html>
